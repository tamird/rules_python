name: Test native runfiles for an independently packaged child
on:
  push:
    branches: [qualification/packaged-child-required-runfile]
permissions: {contents: read}
jobs:
  native:
    if: github.repository == 'tamird/rules_python' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 4, persist-credentials: false}
      - name: Verify the original consumer and prepare Bazel
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5bf01e6babef432b729a72ce7b022fe29c908101
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD:tests/packaged_owner_control/BUILD.bazel)" = f19c220c6dfb3ebe8c0226ad3ac940c87462f665
          test "$(git rev-parse HEAD:python/private/py_executable.bzl)" = 5c08e3f487aee72d7731170b86e0efb1d4df1c0b
          git diff --exit-code HEAD^ HEAD -- . ':!.github/workflows/packaged-owner.yml' ':!.github/qualification/packaged-owner/consumer.py' ':!tests/packaged_owner_control/source_owner_test.py'
          mkdir -m 0700 "$RUNNER_TEMP/packaged-owner"
          curl --retry 3 -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/packaged-owner/bazelisk"
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/packaged-owner/bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/packaged-owner/bazelisk"
      - name: Run release launcher tests and the three packaged-child controls
        run: python3 -IB .github/qualification/packaged-owner/consumer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-child-required-runfile
          path: ${{ runner.temp }}/packaged-owner/consumer.json
          if-no-files-found: error
          retention-days: 7
