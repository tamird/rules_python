name: Check opt-in launcher resolution
on:
  push:
    branches: [qualification/native-bootstrap-optional-tools]
permissions: {contents: read}
jobs:
  select:
    if: github.repository == 'tamird/rules_python' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 2, persist-credentials: false}
      - name: Check the cold default and native configurations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4823082f5236fdc3d8af265bd2900d50f09182b6
          cp -r .github/qualification/native-optional "$RUNNER_TEMP/native-optional"
          git switch --quiet --detach 4823082f5236fdc3d8af265bd2900d50f09182b6
          curl --retry 3 -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk"
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazelisk"
          python3 -I -B "$RUNNER_TEMP/native-optional/check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selected-native-tools
          path: ${{ runner.temp }}/native-optional/receipt.json
          if-no-files-found: error
          retention-days: 7
