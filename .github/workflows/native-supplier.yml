name: Qualify a source-built launcher with the packaged Python program
on:
  push:
    branches: [qualification/native-supplier-exec]
permissions: {contents: read}
jobs:
  native:
    if: github.repository == 'tamird/rules_python' && github.actor == github.repository_owner && github.event.created && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: rules_python, fetch-depth: 2, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {repository: hermeticbuild/hermetic-launcher, ref: b0d103f65a4d2a14c6407d2ffb7208aa36cd745f, path: hermetic-launcher, fetch-depth: 0, persist-credentials: false}
      - name: Build the supplier library and test its actual package
        run: |
          set -euo pipefail
          test "$(git -C rules_python rev-parse HEAD^)" = e2b836748128c8dfe47074a0d719e190c97e2b97
          cp -r rules_python/.github/qualification/native-supplier "$RUNNER_TEMP/native-supplier"
          git -C rules_python switch --quiet --detach e2b836748128c8dfe47074a0d719e190c97e2b97
          curl --retry 3 -fsSL https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 -o "$RUNNER_TEMP/bazelisk"
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $RUNNER_TEMP/bazelisk" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bazelisk"
          python3 -I -B "$RUNNER_TEMP/native-supplier/check.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-supplier-and-package
          path: ${{ runner.temp }}/native-supplier/receipt.json
          if-no-files-found: error
          retention-days: 7
