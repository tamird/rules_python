name: Compare Python launcher behavior and startup
on:
  push:
    branches: [qualification/native-startup-cost]
permissions:
  contents: read
jobs:
  startup:
    if: github.repository == 'tamird/rules_python' && github.event.created
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 5, persist-credentials: false}
      - name: Compare the same static interpreter and existing startup behavior
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/python-startup"
          mkdir -p "$d"
          cp .github/qualification/native_stage1/* "$d"
          test "$(git rev-parse HEAD^)" = c3ab160ae7c57e79e1847bb18fc2940e49295039
          curl -fsSL --proto '=https' --proto-redir '=https' https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64 -o "$d/bazelisk"
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  $d/bazelisk" | sha256sum -c -
          chmod 755 "$d/bazelisk"
          python3 -B "$d/startup.py"
      - name: Calculate benchstat on the recorded samples
        run: |
          cd "$RUNNER_TEMP/python-startup"
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e stock.txt native.txt | tee benchstat.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-startup-cost
          path: |
            ${{ runner.temp }}/python-startup/result.json
            ${{ runner.temp }}/python-startup/stock.txt
            ${{ runner.temp }}/python-startup/native.txt
            ${{ runner.temp }}/python-startup/benchstat.txt
          retention-days: 7
